# TabClaw 插件清单（首个上架插件，信息源自 data/assets/engineering/TabClaw/ 部署实测）
name: TabClaw 表格分析智能体
slug: tabclaw
version: 0.1.0
description: 交互式表格分析 AI 智能体：拖入 CSV/Excel，自然语言下达需求，先出计划、并行多智能体分析、记住用户偏好、可从交互中提炼可复用技能
runtime: native
instance: shared
source_repo: https://github.com/fishsure/TabClaw
source_commit: '420125a'
env:
  workdir: repos/TabClaw
  config_files: setting.txt.example -> setting.txt
  config_note: API_KEY/BASE_URL/DEFAULT_MODEL 三项，BASE_URL 为方舟 OpenAI 兼容端点
  setup: python3 -m venv .venv && source .venv/bin/activate && pip install -r requirements.txt
  start: source .venv/bin/activate && uvicorn app:app --host 0.0.0.0 --port 8000
  health: GET http://localhost:8000 -> 200
  port: 8000
  notes: numpy 必须 <2；端口 8000 勿与 mkdocs 预览同开
tools:
  analyze_table:
    description: 对表格数据（CSV/Excel/URL）做自然语言分析，返回结论与过程
    class: db_read
    risk: medium
    entry:
      command: curl
      args: ['-s', '-X', 'POST', 'http://localhost:8000/api/analyze', '-H', 'Content-Type: application/json', '-d', '{payload}']
    timeout_s: 120
compat:
  mcp: 'stdio: python3 repos/TabClaw/mcp_server.py（若上游提供）'
